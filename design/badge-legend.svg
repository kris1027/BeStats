<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="114" viewBox="0 0 1640 114" fill="none">
<title>BeStats — Badge legend</title>
<desc>Editable legend for TMDB rating, Your Score, Planned, Plan, Stop watching and Watch again. Vector icons and editable text on black.</desc>
<rect id="background" width="1640" height="114" fill="#000000"/>
<g font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#A5ADB3">
<g id="tmdb-rating"><polygon points="118.00,52.00 122.11,60.34 131.31,61.67 124.66,68.16 126.23,77.33 118.00,73.00 109.77,77.33 111.34,68.16 104.69,61.67 113.89,60.34" fill="#FFC526" stroke="#FFC526" stroke-width="2" stroke-linejoin="round"/><text x="150" y="76">TMDB rating</text></g>
