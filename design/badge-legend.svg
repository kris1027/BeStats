<g id="stop-watching"><circle cx="1043" cy="66" r="13" fill="none" stroke="#F6F7F8" stroke-width="2.5"/><rect x="1039" y="62" width="8" height="8" rx="1" fill="none" stroke="#F6F7F8" stroke-width="2.3"/><text x="1075" y="76">Stop watching</text></g>
